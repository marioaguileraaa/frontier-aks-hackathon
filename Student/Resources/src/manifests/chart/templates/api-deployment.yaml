apiVersion: apps/v1
kind: Deployment
metadata:
  name: fabtech-api
  namespace: {{ .Release.Namespace }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: fabtech-api
  template:
    metadata:
      labels:
        app: fabtech-api
        azure.workload.identity/use: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: fabtech-api
      serviceAccountName: {{ .Values.api.serviceAccountName | quote }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.service.port }}
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
            {{- if .Values.sharedStorage.enabled }}
            - name: shared-content
              mountPath: {{ .Values.sharedStorage.mountPath | quote }}
              readOnly: false
            {{- end }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.api.database.secretProviderClass | quote }}
        {{- if .Values.sharedStorage.enabled }}
        - name: shared-content
          persistentVolumeClaim:
            claimName: {{ .Values.sharedStorage.existingClaim | quote }}
        {{- end }}
