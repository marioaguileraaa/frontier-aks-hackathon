api:
  image:
    repository: acraksab.azurecr.io/content-api
    tag: v2
    pullPolicy: IfNotPresent
  replicaCount: 2
  autoscaling:
    enabled: true
  serviceAccountName: fabtech-api-sa
  database:
    secretProviderClass: fabtech-secrets
  service:
    port: 3001
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

web:
  image:
    repository: acraksab.azurecr.io/content-web
    tag: v1
    pullPolicy: IfNotPresent
  replicaCount: 2
  contentApiUrl: http://fabtech-api:3001
  service:
    port: 3000
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

sharedStorage:
  enabled: false
  existingClaim: c09-shared-content
  mountPath: /mnt/shared

# Traffic exposure is handled separately — choose one:
#   Option A (Gateway API via App Routing):  kubectl apply -f ../gateway.yaml
#   Option B (Gateway API via AGC):          kubectl apply -f ../agc.yaml
